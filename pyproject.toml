[project]
name = "julia-package-count"
version = "0.1.0"
description = "Count Julia General registry packages over time, excluding JLL packages, and generate CSV and charts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.9",
]

[project.scripts]
julia-package-count = "julia_package_count.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/julia_package_count"]
